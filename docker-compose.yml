# Локальный сервер cobalt для скрипта: docker compose up -d
# В настройках скрипта указать адрес http://localhost:9000/
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:9000:9000/tcp
    environment:
      API_URL: "http://localhost:9000/"
